name: Clang strict prototypes

on:
  push:
    branches: [master]
    paths:
      - 'configure.ac'
      - 'acinclude.m4'
      - 'Makefile.am'
      - 'libisofs-1.pc.in'
      - 'bootstrap'
      - 'libisofs/libisofs.h'
      - 'libisofs/messages.c'
      - 'libisofs/hfsplus.h'
      - 'libisofs/hfsplus_decompose.c'
      - 'libisofs/hfsplus_classes.c'
      - 'demo/demo.c'
      - 'test/test_strict_prototypes.py'
      - 'test/test_build_sed.sh'
      - '.github/workflows/clang-strict-prototypes.yml'
  pull_request:
    paths:
      - 'configure.ac'
      - 'acinclude.m4'
      - 'Makefile.am'
      - 'libisofs-1.pc.in'
      - 'bootstrap'
      - 'libisofs/libisofs.h'
      - 'libisofs/messages.c'
      - 'libisofs/hfsplus.h'
      - 'libisofs/hfsplus_decompose.c'
      - 'libisofs/hfsplus_classes.c'
      - 'demo/demo.c'
      - 'test/test_strict_prototypes.py'
      - 'test/test_build_sed.sh'
      - '.github/workflows/clang-strict-prototypes.yml'

permissions:
  contents: read

jobs:
  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit build sed expressions
        run: test/test_build_sed.sh
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake clang libtool llvm pkg-config zlib1g-dev
      - name: Audit declarations and definitions
        run: python3 test/test_strict_prototypes.py
      - name: Compile public header with strict prototypes
        shell: bash
        run: |
          cat > /tmp/libisofs-strict-prototypes.c <<'EOF'
          #define HAVE_STDINT_H 1
          #include <sys/types.h>
          #include <time.h>
          #include "libisofs/libisofs.h"
          int main(void)
          {
              return 0;
          }
          EOF
          clang -std=c17 -Wall -Wextra -Werror -Wstrict-prototypes \
            -I. -fsyntax-only /tmp/libisofs-strict-prototypes.c

      - name: Build library with strict prototypes
        shell: bash
        run: |
          ./bootstrap
          # Obsolete probe macros can silently change configure results on
          # newer Autoconf. Treat any future obsolete-macro use as a CI error.
          autoconf -W none,obsolete,error
          mkdir build-strict
          cd build-strict
          CC=clang CFLAGS='-O2' ../configure \
            --disable-shared \
            --enable-static \
            --disable-verbose-debug \
            --disable-libacl \
            --disable-libjte \
            --disable-ldconfig-at-install
          if grep '^DEFS = ' Makefile | grep -q 'LIBISOFS_VERBOSE_DEBUG'; then
            echo "configure incorrectly enabled verbose debug" >&2
            exit 1
          fi
          for tool in llvm-ar llvm-ranlib llvm-nm llvm-objdump llvm-strip; do
            command -v "$tool" >/dev/null
          done
          grep -Eq '^AR=.*llvm-ar' libtool
          grep -Eq '^RANLIB=.*llvm-ranlib' libtool
          grep -Eq '^NM=.*llvm-nm' libtool
          grep -Eq '^OBJDUMP=.*llvm-objdump' libtool
          grep -Eq '^STRIP=.*llvm-strip' libtool
          make -j2 CFLAGS='-O2 -Werror=strict-prototypes'
